<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WAD Ranker &amp; Reviewer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@500;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
</head><body>
<style>
/* Layout: sticky status-bar header over a full-width content column; catalogs are dense poster grids, detail pages are titlepic + stat sheet + data table. Single dark look on purpose (a Doom status bar, not a theme). */
:root{
  color-scheme:dark;
  --bg:#15120e;          /* gunmetal brown, Doom HUD backing */
  --panel:#201b15;
  --panel-2:#2a231b;
  --line:#3b3127;
  --fg:#ece0ca;          /* bone */
  --muted:#a6957a;
  --dim:#75674f;
  --brass:#d2a54b;       /* status-bar brass, primary accent */
  --brass-ink:#1b1408;
  --nukage:#86c43f;      /* demo completion */
  --nukage-bg:#1f2a12;
  --blood:#d0503c;       /* destructive */
  --route:#e0b13a;       /* routing & practicing */
  --t-s:#f2c94c; --t-a:#7fcf62; --t-b:#5cc2b0; --t-c:#d8cf5a; --t-d:#e38a3c; --t-f:#d24b3c;
  --t-x:#e0457b; --t-e:#7d8fa8;
  --f-display:"Tektur","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--f-body);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1400px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:2px solid var(--line);box-shadow:0 2px 0 #0006}
.bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.logo{font:700 22px/1 var(--f-display);color:var(--brass);text-decoration:none;letter-spacing:.02em;white-space:nowrap}
.logo small{display:block;font:500 11px/1.3 var(--f-body);color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
nav.main{display:flex;gap:4px;flex-wrap:wrap}
nav.main a{text-decoration:none;padding:7px 12px;border-radius:var(--r);color:var(--muted);font-weight:600;font-size:15px}
nav.main a:hover{color:var(--fg);background:var(--panel-2)}
nav.main a[aria-current="page"]{color:var(--brass-ink);background:var(--brass)}
.bar .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
.switch input{appearance:none;width:38px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch input:checked{background:var(--brass)}
.switch input:checked::after{transform:translateX(16px);background:var(--brass-ink)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brass);color:var(--brass-ink);border-color:var(--brass)}
.btn.danger{color:var(--blood);border-color:#5a2a22}
.btn.small{padding:4px 8px;font-size:13px}
.btn.ghost{background:transparent}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:4px;font-size:15px;line-height:1}
.icon-btn:hover{color:var(--fg);background:var(--panel-2)}

main{padding-block:28px 80px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font:700 clamp(30px,4.4vw,52px)/1.05 var(--f-display);letter-spacing:.01em}
h2{font:700 24px/1.2 var(--f-display);color:var(--brass)}
h3{font:600 17px/1.3 var(--f-body)}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
section.block{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.crumbs{font-size:14px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.crumbs a{color:var(--muted)}
.crumbs a:hover{color:var(--brass)}

/* toolbar */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0 22px}
.toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea,.cell-in{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px;font-size:14px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px;max-width:340px}
.count{font:500 14px var(--f-data);color:var(--muted);margin-left:auto}

/* catalog grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(42%,230px),1fr));gap:22px 18px}
.tile{display:flex;flex-direction:column;gap:8px;text-decoration:none;padding:10px;border-radius:8px;transition:background .12s;position:relative;min-width:0}
.tile:hover{background:var(--panel-2)}
.tile .info{min-width:0;display:flex;flex-direction:column;gap:2px}
.tile .t{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.tile .a{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:500 12px var(--f-data);color:var(--dim);margin-top:2px}
.chip{display:inline-block;font:600 11px/1 var(--f-data);letter-spacing:.04em;padding:4px 6px;border-radius:4px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tile.done{background:var(--nukage-bg);box-shadow:inset 0 0 0 1px #4f7a22}
.tile.done .t{color:var(--nukage)}

.pic{aspect-ratio:4/3;width:100%;max-width:100%;border-radius:6px;overflow:hidden;position:relative;background:var(--panel-2);box-shadow:0 6px 18px #0007}
.pic img{display:block}
/* Pictures are never cropped: the whole image sits on a blurred copy of itself.
   Frames marked .fit take the image's own shape once it loads (capped in height). */
img.main{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1}
img.bgfill{position:absolute;inset:-8%;width:116%;height:116%;object-fit:cover;filter:blur(18px) brightness(.45) saturate(1.2);pointer-events:none}
img.pixel{image-rendering:pixelated}
.pic.fit{max-height:78vh}
.ph{position:absolute;inset:0;display:flex;align-items:flex-end;padding:10px;font:700 17px/1.05 var(--f-display);color:#f6ead2;text-shadow:0 2px 0 #0009;overflow:hidden;overflow-wrap:anywhere}
.ph::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000022 3px 4px);pointer-events:none}
.badge-grade{position:absolute;top:8px;right:8px;z-index:2}
.pic .ph{z-index:1}

.progress{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--nukage);border-radius:4px}
.progress.part>i{background:var(--route)}
.prog-label{display:flex;justify-content:space-between;font:500 12px var(--f-data);color:var(--muted)}

/* grades */
.g{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 6px;border-radius:5px;font:700 14px/1 var(--f-display);color:#130f0a;background:var(--muted)}
.g.lg{min-width:58px;height:46px;font-size:26px;border-radius:7px}
.g.none{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.g.S{background:var(--t-s)}.g.A{background:var(--t-a)}.g.B{background:var(--t-b)}.g.C{background:var(--t-c)}.g.D{background:var(--t-d)}.g.F{background:var(--t-f)}
.g.X{background:var(--t-x)}.g.E{background:var(--t-e)}
.gnum{font:500 13px var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}

/* IWAD cards */
.iwads{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:22px}
.iwad{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-decoration:none}
.iwad:hover{border-color:var(--brass)}
.iwad .excerpt{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:480px){.iwad{grid-template-columns:1fr}}

/* WAD page */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.hero .pic{box-shadow:0 10px 30px #000a}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 22px;margin-top:16px}
.fact .k{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:5px}
.fact .v{font:500 16px/1.3 var(--f-data);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.score{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.score .lbl{font:600 12px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.score .line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score .avg{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.score select{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table.maps{border-collapse:collapse;width:100%;font:400 14px/1.35 var(--f-data);font-variant-numeric:tabular-nums}
table.maps th{position:sticky;top:0;background:var(--panel-2);text-align:left;font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
table.maps td{padding:7px 10px;border-bottom:1px solid #2b241c;vertical-align:middle;white-space:nowrap}
table.maps td.wrapcell{white-space:normal;min-width:160px;max-width:260px}
table.maps tr:hover td{background:#ffffff06}
table.maps td.num,table.maps th.num{text-align:right}
table.maps a.mapname{font-weight:600;font-size:15px;color:var(--fg);text-decoration:none;border-bottom:1px solid var(--line)}
table.maps a.mapname:hover{color:var(--brass);border-color:var(--brass)}
.slot{font:700 13px var(--f-display);color:var(--brass)}
.st{font:600 12px var(--f-data);padding:3px 7px;border-radius:4px;white-space:nowrap}
.st.ok{background:var(--nukage-bg);color:var(--nukage)}
.st.st-rt{background:#3a2e10;color:var(--route)}
.st.no{background:var(--panel-2);color:var(--dim)}
tr.done td{background:#86c43f0d}
/* Map list: every column fits on desktop; on phones each map becomes a compact card */
table.maplist{font-size:13.5px}
table.maplist th,table.maplist td{padding:8px 8px}
table.maplist td{white-space:normal}
table.maplist .ctr{text-align:center}
table.maplist td.c-map{min-width:215px}
table.maplist td.c-midi{min-width:120px;font-size:13px}
table.maplist .sub{font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
table.maplist td.ctr .g{min-width:30px;height:22px;font-size:12px}
table.maplist td.num{white-space:nowrap}
table.maplist td.c-del{width:1%}
table.maplist .ed{display:inline-block;min-width:1.6em;padding:1px 3px;margin:-1px -3px;border-radius:3px;border-bottom:1px dashed var(--line);outline:none;cursor:text}
table.maplist .ed:hover{background:#ffffff0a}
table.maplist .ed:focus{background:var(--bg);box-shadow:0 0 0 1px var(--brass);border-bottom-color:transparent}
table.maplist .ed:empty::before{content:attr(data-ph);color:var(--dim);font-style:italic}
table.maplist .mapname-ed{font-weight:600;font-size:15px;color:var(--fg)}
table.maplist .mapcell{display:flex;align-items:center;gap:10px}
table.maplist .mtext{min-width:0}
.mthumb{flex:none;display:block;width:80px;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:var(--panel-2);border:1px solid var(--line);position:relative}
.mthumb img{width:100%;height:100%;object-fit:cover;display:block}
.mthumb.empty{background:var(--panel-2) repeating-linear-gradient(45deg,#0000 0 6px,#ffffff05 6px 12px)}
button.mthumb{cursor:pointer;color:var(--dim);font-size:18px;padding:0}
button.mthumb:hover{color:var(--brass);border-color:var(--brass)}
a.mthumb:hover{border-color:var(--brass)}
table.maplist .namecell{display:flex;align-items:baseline;gap:6px}
table.maplist .open{color:var(--muted);text-decoration:none;font-size:13px;padding:0 3px;border-radius:3px}
table.maplist .open:hover{color:var(--brass)}
table.maplist .kis{white-space:nowrap}
table.maplist .kis .ed{min-width:1.2em;text-align:right}
table.maplist select.gsel{appearance:none;-webkit-appearance:none;border:0;border-radius:5px;font:700 12px/1 var(--f-display);height:22px;min-width:34px;padding:0 6px;text-align:center;text-align-last:center;cursor:pointer;color:#130f0a}
table.maplist select.gsel.none{background:transparent;border:1px dashed var(--line);color:var(--dim)}
table.maplist select.gsel option{background:var(--panel);color:var(--fg)}
table.maplist button.cyc{border:0;background:transparent;padding:2px;cursor:pointer;border-radius:4px}
table.maplist button.cyc:hover{background:#ffffff0a}
table.maplist select.rsel{width:auto;max-width:100%;font-size:12.5px;padding:3px 4px}
@media (max-width:760px){
  table.maplist thead{display:none}
  table.maplist,table.maplist tbody{display:block}
  table.maplist tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
  table.maplist td{display:block;padding:0;border:0;text-align:left!important;min-width:0!important}
  table.maplist td.c-slot{grid-column:1/2}
  table.maplist td.c-map{grid-column:2/-1}
  table.maplist td.c-midi{grid-column:1/-1}
  table.maplist td[data-l]::before{content:attr(data-l);display:block;font:600 10px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  table.maplist td.c-del{grid-column:-2/-1;text-align:right!important}
  table.maplist tr.done{background:#86c43f0d}
  table.maplist tr td,table.maplist tr:hover td{background:none}
  table.maplist td[data-l]:empty{display:none}
}

.cell-in{padding:4px 6px;width:80px}
.box{display:inline-grid;place-items:center;width:20px;height:20px;border:2px solid var(--dim);border-radius:4px;font:800 13px/1 var(--f-body);color:#132006;vertical-align:middle}
.box.b-ok{background:var(--nukage);border-color:var(--nukage)}
.box.b-rt{border-color:var(--route);background:linear-gradient(135deg,var(--route) 50%,transparent 50%)}
select.cell-in{width:auto}

/* rich text */
.rt-box{border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.rt-tools{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rt-tools button{border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 9px;cursor:pointer;color:var(--muted);font-size:14px}
.rt-tools button:hover{color:var(--fg);border-color:var(--line)}
.rt{padding:14px 16px;min-height:120px;outline:none;line-height:1.65}
.rt:empty::before{content:attr(data-ph);color:var(--dim);font-style:italic}
.rt p{margin:0 0 .8em}.rt ul,.rt ol{margin:.3em 0 .9em;padding-left:1.4em}
.prose{line-height:1.65}
.prose p{margin:0 0 .8em}.prose ul,.prose ol{padding-left:1.4em}
.empty-note{color:var(--dim);font-style:italic}

/* map page */
.viewer{position:relative;aspect-ratio:16/9;max-height:80vh;max-width:100%;background:var(--panel-2) repeating-linear-gradient(45deg,#0000 0 10px,#ffffff05 10px 20px);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dim);text-align:center}
.viewer img.main{cursor:zoom-in}
.viewer .cap{position:absolute;left:12px;bottom:12px;z-index:2;font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:#000b;color:var(--fg);padding:6px 9px;border-radius:4px}
.viewer .count-cap{left:auto;right:12px}
.viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;background:#000a;color:var(--fg);width:42px;height:42px;border-radius:50%;cursor:pointer;font-size:18px}
.viewer .vnav.l{left:12px}.viewer .vnav.r{right:12px}
.viewer label{cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;padding:20px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,150px),1fr));gap:10px;margin-top:10px}
.thumb{position:relative;aspect-ratio:16/9;border:2px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel-2);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:12px}
.thumb.on{border-color:var(--brass)}
.thumb .cap{position:absolute;z-index:2;left:4px;bottom:4px;font:600 10px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:#000b;color:var(--fg);padding:3px 5px;border-radius:3px}
.thumb .x{position:absolute;z-index:2;top:3px;right:3px;background:#000b;color:var(--fg);border:0;border-radius:3px;cursor:pointer;padding:1px 6px;font-size:12px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.pager .btn{max-width:calc(50% - 6px);overflow:hidden;text-overflow:ellipsis}
.mapname-big{font:700 clamp(34px,5.5vw,64px)/1.02 var(--f-display);margin-top:6px;overflow-wrap:anywhere}
.grade-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.ladder{display:flex;flex-wrap:wrap;gap:5px}
.ladder button{border:1px solid var(--line);background:var(--bg);border-radius:5px;min-width:38px;padding:6px 4px;font:700 14px var(--f-display);cursor:pointer;color:var(--muted)}
.ladder button:hover{border-color:var(--muted);color:var(--fg)}
.ladder button.on{color:#130f0a;border-color:transparent}
.ladder button:disabled{cursor:default;opacity:.55}
.ladder button.on:disabled{opacity:1}

/* forms / modal */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font:600 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field.wide{grid-column:1/-1}
.field input,.field select,.field textarea{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:#000b}
dialog .dhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog .dbody{padding:18px 20px;overflow:auto}
dialog .dfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.lightbox{width:min(1400px,calc(100vw - 24px));background:#000}
.lightbox img{display:block;width:100%;height:auto;max-height:calc(100vh - 60px);object-fit:contain}

/* about */
.about-hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:32px;align-items:end;padding-bottom:28px;border-bottom:2px solid var(--line)}
@media (max-width:820px){.about-hero{grid-template-columns:1fr}}
.hud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--panel);border:2px solid var(--line);border-radius:8px;overflow:hidden}
.hud div{padding:12px 10px;border-right:2px solid var(--line);text-align:center;min-width:0}
.hud div:last-child{border-right:0}
.hud b{display:block;font:700 clamp(22px,3vw,34px)/1 var(--f-display);color:var(--blood);font-variant-numeric:tabular-nums}
.hud span{font:600 10px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
@media (max-width:480px){.hud{grid-template-columns:repeat(2,minmax(0,1fr))}.hud div:nth-child(2){border-right:0}.hud div:nth-child(-n+2){border-bottom:2px solid var(--line)}}
.about-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px 36px;margin-top:32px}
.fold{min-width:0}
.fold>summary{list-style:none;display:flex;align-items:baseline;justify-content:space-between;gap:12px;cursor:pointer;padding-bottom:12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary h2::before{content:"▸";display:inline-block;margin-right:10px;color:var(--muted);transition:transform .15s}

.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px;margin-top:8px}

.list li:last-child{border-bottom:0}

.list .lt a{text-decoration:none}.list .lt a:hover{color:var(--brass)}
.list .ls{font-size:12.5px;color:var(--muted)}
.list .ctl{display:flex;gap:0}
.list .add{display:flex;gap:6px;margin-top:6px}
.list .add input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;font-size:14px}
.scale-table{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.scale{display:flex;flex-wrap:wrap;gap:6px}
.scale span{display:inline-flex;flex-direction:column;align-items:center;gap:3px;font:500 12px var(--f-data);color:var(--muted)}

.savestate{font:500 13px var(--f-data);color:var(--muted)}
.savestate.err{color:var(--blood)}

.loading{padding:80px 0;text-align:center;font:700 22px var(--f-display);color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
(() => {
"use strict";
/* ---------- grade scales ---------- */
const Q_SCALE = [["S+",10],["S",9.5],["S-",9],["A+",8.5],["A",8],["A-",7.5],["B+",7],["B",6.5],["B-",6],["C+",5.5],["C",5],["C-",4.5],["D+",4],["D",3.5],["D-",3],["F",2.5]];
const D_SCALE = [["X+",10],["X",9.5],["X-",9],["A+",8.5],["A",8],["A-",7.5],["B+",7],["B",6.5],["B-",6],["C+",5.5],["C",5],["C-",4.5],["D+",4],["D",3.5],["D-",3],["E+",2.5],["E",2],["E-",1.5]];
const INDEX = [["Doomed",8000],["Legendary",2500],["Elite",800],["Jaded",300],["Veteran",100],["Marine",50],["Recruit",20],["Fairweather",10],["Beginner",5]];
const INDEX_PTS = Object.fromEntries(INDEX);
const COMP_ORDER = ["Vanilla","Limit-removing","Final Doom","Boom","MBF","MBF21","Eternity","Zdoom","UDMF"];
const IWAD_LIST = ["Doom","Doom 2","TNT: Evilution","Plutonia"];
const WAD_STATUS = ["Complete","Complete (SOLO WAD)","In Progress","Backlog","Not Being Looked At"];
const MAP_DEMO = ["Incomplete","Routing & Practicing","Complete"];

const letter = (n, scale) => {
  if (n == null || n === "" || isNaN(n)) return null;
  let best = scale[0], bd = Infinity;
  for (const s of scale) { const d = Math.abs(s[1] - n); if (d < bd) { bd = d; best = s; } }
  if (n < scale[scale.length - 1][1]) best = scale[scale.length - 1];
  return best[0];
};
const gradeChip = (n, scale, lg) => {
  const L = letter(n, scale);
  if (!L) return `<span class="g none${lg ? " lg" : ""}">—</span>`;
  return `<span class="g ${L[0]}${lg ? " lg" : ""}" title="${fmtN(n)} / 10">${L}</span>`;
};
const fmtN = n => n == null || n === "" || isNaN(n) ? "—" : (Math.round(n * 100) / 100).toString();
const avg = arr => { const v = arr.filter(x => typeof x === "number" && !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

/* ---------- utils ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const slugify = t => String(t).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "wad";
const fmtTime = s => { if (s == null || s === "" || isNaN(s)) return ""; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}` : `${m}:${String(x).padStart(2,"0")}`; };
const parseTime = str => { str = String(str).trim(); if (!str) return null; const p = str.split(":").map(Number); if (p.some(isNaN)) return null; return p.reduce((a, b) => a * 60 + b, 0); };
const fmtDate = iso => { if (!iso) return "—"; const d = new Date(iso + "T00:00:00"); return isNaN(d) ? iso : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }); };
const year = iso => iso ? iso.slice(0, 4) : "—";
const slotKey = s => { s = String(s || "").toUpperCase(); let m = s.match(/^E(\d+)M(\d+)/); if (m) return +m[1] * 100 + +m[2]; m = s.match(/(\d+)/); return m ? 10000 + +m[1] : 99999; };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const toast = msg => { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.append(t); setTimeout(() => t.remove(), 1800); };

const SAFE_TAGS = new Set(["B","STRONG","I","EM","U","UL","OL","LI","P","BR","DIV","A","H3","BLOCKQUOTE"]);
function sanitize(html) {
  const doc = new DOMParser().parseFromString(`<div>${html || ""}</div>`, "text/html");
  const walk = node => {
    for (const el of [...node.children]) {
      walk(el);
      if (!SAFE_TAGS.has(el.tagName)) { el.replaceWith(...el.childNodes); continue; }
      for (const a of [...el.attributes]) if (!(el.tagName === "A" && a.name === "href" && /^https?:/i.test(a.value))) el.removeAttribute(a.name);
      if (el.tagName === "A") { el.setAttribute("target", "_blank"); el.setAttribute("rel", "noopener"); }
    }
  };
  walk(doc.body.firstChild);
  return doc.body.firstChild.innerHTML.replace(/^(<br>|\s)+$/, "");
}

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
const DB = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open("wad-ranker", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => res(); } catch { res(); } }); },
  get(k) { return new Promise(res => { try { const r = this.db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch { res(null); } }); },
  set(k, v) { return new Promise(res => { try { const t = this.db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch { res(false); } }); }
};
let S = null, saveTimer = null, persistOK = true;
/* SERVER mode (live site on Vercel) saves to cloud storage; LOCAL mode (preview) saves in this browser */
let SERVER = false, ADMIN = false, ME = {};
const setSaveState = (t, err) => { const el = $("#saveState"); if (el) { el.textContent = t; el.classList.toggle("err", !!err); } };
async function api(path, opts = {}) {
  const r = await fetch(path, { credentials: "same-origin", ...opts, headers: { "Content-Type": "application/json", ...(opts.headers || {}) } });
  let j = null; try { j = await r.json(); } catch {}
  if (!r.ok) throw new Error(j?.error || `Request failed (${r.status})`);
  return j;
}
const save = () => {
  clearTimeout(saveTimer);
  if (SERVER) {
    if (!ADMIN) return;
    setSaveState("Unsaved changes…");
    saveTimer = setTimeout(async () => {
      setSaveState("Saving…");
      try { await api("/api/state", { method: "PUT", body: JSON.stringify(S) }); setSaveState("All changes saved"); }
      catch (e) { setSaveState("Not saved: " + e.message, true); }
    }, ME.dataStore === "blob" ? 8000 : 1500);
    return;
  }
  saveTimer = setTimeout(async () => { persistOK = await DB.set("state", S); if (!persistOK) toast("Couldn't save in this browser. Use Backup to keep your changes."); }, 300);
};
window.addEventListener("beforeunload", e => { if (SERVER && /Unsaved|Saving/.test($("#saveState")?.textContent || "")) { e.preventDefault(); e.returnValue = ""; } });
async function storeImage(dataUrl, name) {
  if (!SERVER || !dataUrl || !dataUrl.startsWith("data:")) return dataUrl;
  const j = await api("/api/upload", { method: "POST", body: JSON.stringify({ dataUrl, name }) });
  return j.url;
}
const pref = { get(k, d) { try { const v = localStorage.getItem("wr-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v) { try { localStorage.setItem("wr-" + k, JSON.stringify(v)); } catch {} } };

function buildFromSeed(seed) {
  const wads = seed.wads.map(w => {
    w.maps.forEach((m, i) => { m.id = (m.slot || "m").toLowerCase().replace(/[^a-z0-9]/g, "") + "-" + i; m.shots = m.shots || []; });
    return w;
  });
  const st = { version: 1, about: { name: "Levi", tagline: "Classic Doom player, demo runner and WAD reviewer.", journey: "", play: "", record: "", review: "" }, lists: {}, wads };
  // Seed top-10s from the spreadsheet grades so the page starts with real picks
  const all = wads.flatMap(w => w.maps.map(m => ({ w, m })));
  const wadQ = w => w.q ?? avg(w.maps.map(m => m.q)), wadD = w => w.d ?? avg(w.maps.map(m => m.d));
  const topW = f => wads.filter(w => f(w) != null).sort((a, b) => f(b) - f(a)).slice(0, 10).map(w => ({ label: w.title, sub: w.authors, ref: `wad--${w.id}` }));
  const topM = f => all.filter(x => x.m[f] != null).sort((a, b) => b.m[f] - a.m[f]).slice(0, 10).map(({ w, m }) => ({ label: m.name, sub: `${w.title} · ${m.slot}`, ref: `map--${w.id}--${m.id}` }));
  const by = {}; all.forEach(({ m }) => { if (m.q != null && m.authors) (by[m.authors] ||= []).push(m.q); });
  const mappers = Object.entries(by).filter(([, v]) => v.length >= 4).map(([k, v]) => [k, avg(v), v.length]).sort((a, b) => b[1] - a[1]).slice(0, 10).map(([k, a, n]) => ({ label: k, sub: `Avg. quality ${a.toFixed(1)} over ${n} maps` }));
  st.lists = {
    favWads: { title: "Favorite WADs", items: topW(wadQ) },
    favMaps: { title: "Favorite maps", items: topM("q") },
    favMappers: { title: "Favorite mappers", items: mappers },
    hardWads: { title: "Hardest WADs (for me)", items: topW(wadD) },
    hardMaps: { title: "Hardest maps (general)", items: topM("d") },
    hardMapsSaveless: { title: "Hardest maps (saveless)", items: [] }
  };
  return st;
}
const wadById = id => S.wads.find(w => w.id === id);
const sortedMaps = w => [...w.maps].sort((a, b) => slotKey(a.slot) - slotKey(b.slot));
const demoDone = w => w.maps.filter(m => m.demo === "Complete").length;
const wadComplete = w => w.maps.length > 0 && demoDone(w) === w.maps.length;

/* ---------- placeholder titlepic ---------- */
const fitImgHTML = (src, alt, lazy = true) => `<img class="bgfill" src="${src}" alt="" aria-hidden="true"${lazy ? ' loading="lazy"' : ""}><img class="main" data-fit src="${src}" alt="${alt}"${lazy ? ' loading="lazy"' : ""}>`;
function fitImg(im) {
  const w = im.naturalWidth, h = im.naturalHeight; if (!w) return;
  const box = im.closest(".fit"); if (box) box.style.aspectRatio = `${w} / ${h}`;
  // Small images (classic 320x200 TITLEPICs) get blown up with crisp pixels instead of blur
  const shown = im.getBoundingClientRect().width;
  im.classList.toggle("pixel", w < 800 && shown > w * 1.5);
}
document.addEventListener("load", e => { if (e.target instanceof HTMLImageElement && e.target.hasAttribute("data-fit")) fitImg(e.target); }, true);
function picHTML(w, gradeHtml = "", fit = false) {
  if (w.titlepic) return `<div class="pic${fit ? " fit" : ""}">${fitImgHTML(w.titlepic, esc(w.title) + " title screen", !fit)}${gradeHtml}</div>`;
  const h = hash(w.title), hue = h % 360, hue2 = (hue + 30 + (h >> 9) % 60) % 360, ang = (h >> 4) % 180;
  const bg = `background:linear-gradient(${ang}deg,hsl(${hue} 45% 22%),hsl(${hue2} 55% 12%) 70%),hsl(${hue} 30% 15%)`;
  return `<div class="pic"><div class="ph" style="${bg}">${esc(w.title)}</div>${gradeHtml}</div>`;
}

/* ---------- edit mode ---------- */
let EDIT = pref.get("edit", true);
const editToggle = $("#editToggle"); editToggle.checked = EDIT;
function applyAuthUI() {
  if (SERVER) {
    $("#editWrap").hidden = !ADMIN; $("#dataBtn").hidden = !ADMIN;
    $("#loginBtn").hidden = false; $("#loginBtn").textContent = ADMIN ? "Log out" : "Log in";
    if (!ADMIN) EDIT = false; else EDIT = editToggle.checked;
  }
}
$("#loginBtn").addEventListener("click", async () => {
  if (ADMIN) { try { await api("/api/login", { method: "DELETE" }); } catch {} ADMIN = false; applyAuthUI(); render(); toast("Logged out"); return; }
  const d = $("#dlg"); d.onclose = null;
  d.innerHTML = `<form id="lf"><div class="dhead"><h2>Log in</h2><button type="button" class="icon-btn" id="lfx" aria-label="Close">✕</button></div>
    <div class="dbody stack"><label class="field"><span>Admin password</span><input type="password" id="lf-pw" autocomplete="current-password" required></label>
    <p class="muted" id="lf-msg" style="margin:0;font-size:14px">${ME.passwordSet === false ? "No admin password is set yet. Add ADMIN_PASSWORD in the Vercel project settings and redeploy." : "Only you can edit. Visitors see the read-only site."}</p></div>
    <div class="dfoot"><button class="btn primary" id="lf-go">Log in</button></div></form>`;
  d.showModal(); $("#lf-pw").focus();
  $("#lfx").onclick = () => d.close();
  $("#lf").onsubmit = async e => { e.preventDefault(); $("#lf-go").disabled = true;
    try { await api("/api/login", { method: "POST", body: JSON.stringify({ password: $("#lf-pw").value }) }); ADMIN = true; editToggle.checked = true; pref.set("edit", true); d.close(); if (!S) { location.reload(); return; } applyAuthUI(); render(); toast("Logged in. Edit mode is on."); }
    catch (err) { $("#lf-msg").textContent = err.message; $("#lf-msg").style.color = "var(--blood)"; $("#lf-go").disabled = false; } };
});
editToggle.addEventListener("change", () => { EDIT = editToggle.checked && (!SERVER || ADMIN); pref.set("edit", EDIT); render(); });

/* ---------- rich text ---------- */
function rich(id, html, ph) {
  if (!EDIT) return html ? `<div class="prose">${sanitize(html)}</div>` : `<p class="empty-note">${esc(ph)}</p>`;
  return `<div class="rt-box"><div class="rt-tools" role="toolbar">
    <button type="button" data-cmd="bold" title="Bold"><b>B</b></button>
    <button type="button" data-cmd="italic" title="Italic"><i>I</i></button>
    <button type="button" data-cmd="insertUnorderedList" title="Bullet list">• List</button>
    <button type="button" data-cmd="insertOrderedList" title="Numbered list">1. List</button>
  </div><div class="rt" id="${id}" contenteditable="true" data-ph="${esc(ph)}">${sanitize(html)}</div></div>`;
}
function bindRich(root, id, setter) {
  const el = $("#" + CSS.escape(id), root); if (!el) return;
  const box = el.closest(".rt-box");
  $$("[data-cmd]", box).forEach(b => b.addEventListener("mousedown", e => { e.preventDefault(); el.focus(); document.execCommand(b.dataset.cmd); setter(sanitize(el.innerHTML)); save(); }));
  el.addEventListener("input", () => { setter(sanitize(el.innerHTML)); save(); });
  el.addEventListener("paste", e => { e.preventDefault(); const t = e.clipboardData.getData("text/plain"); document.execCommand("insertText", false, t); });
}

/* ---------- images ---------- */
// Big images are shrunk to maxW. Small ones are scaled up by a whole-number factor with
// nearest-neighbour sampling (keeps Doom's pixels sharp) until they reach at least minW.
function sizeImage(img, maxW, minW) {
  let w = img.naturalWidth, h = img.naturalHeight, smooth = true, up = false;
  if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
  else if (w < minW) { let f = Math.ceil(minW / w); while (f > 1 && w * f > maxW) f--; if (f > 1) { w *= f; h *= f; smooth = false; up = true; } }
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d"); x.imageSmoothingEnabled = smooth; if (smooth) x.imageSmoothingQuality = "high";
  x.drawImage(img, 0, 0, w, h);
  if (up) { const png = c.toDataURL("image/png"); if (png.length < 3_600_000) return png; return c.toDataURL("image/jpeg", .92); }
  return c.toDataURL("image/jpeg", .88);
}
function pickImage(maxW = 1920, minW = 1280) {
  return new Promise(res => {
    const inp = $("#filePick"); inp.value = "";
    inp.onchange = () => { const f = inp.files[0]; if (!f) return res(null); const rd = new FileReader();
      rd.onload = () => { const img = new Image(); img.onload = () => { const du = sizeImage(img, maxW, minW); if (!SERVER) return res(du); setSaveState("Uploading image…"); storeImage(du, f.name.replace(/\.[^.]+$/, "")).then(u => { setSaveState(""); res(u); }, err => { setSaveState("Upload failed: " + err.message, true); res(null); }); }; img.onerror = () => res(null); img.src = rd.result; };
      rd.readAsDataURL(f); };
    inp.click();
  });
}
function lightbox(src) { const d = $("#lightbox"); d.innerHTML = `<img src="${src}" alt="">`; d.onclick = () => d.close(); d.showModal(); }

/* ---------- router ---------- */
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, "")) || "about";
  const p = h.split("--");
  return { name: p[0], a: p[1], b: p[2] };
}
// Older saves have a single "hardest maps" list: add the saveless one right after it
function migrateLists() {
  const L = S.lists || (S.lists = {});
  if (L.hardMapsSaveless) return;
  if (L.hardMaps?.title === "Hardest maps (for me)") L.hardMaps.title = "Hardest maps (general)";
  const out = {};
  for (const [k, v] of Object.entries(L)) { out[k] = v; if (k === "hardMaps") out.hardMapsSaveless = { title: "Hardest maps (saveless)", items: [] }; }
  if (!out.hardMapsSaveless) out.hardMapsSaveless = { title: "Hardest maps (saveless)", items: [] };
  S.lists = out;
}
function render() {
  if (!S) return setupScreen();
  migrateLists();
  const r = route(), app = $("#app");
  const navKey = { wad: null, map: null, demo: "demos" }[r.name] ?? r.name;
  let wadNav = null;
  if (r.name === "wad" || r.name === "map") { const w = wadById(r.a); wadNav = w?.isIWAD ? "iwads" : "wads"; }
  $$("#nav a").forEach(a => a.dataset.nav === (wadNav || navKey) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  const views = { about: viewAbout, wads: () => viewCatalog(false), iwads: viewIwads, wad: () => viewWad(r.a), map: () => viewMap(r.a, r.b), demos: viewDemos, demo: () => viewDemoWad(r.a) };
  (views[r.name] || viewAbout)(app);
  $$("img[data-fit]", app).forEach(im => im.complete && fitImg(im));
}

function filterSort(list, st, sorts) {

function bindMapListEditing(app, w) {
  const mapOf = el => w.maps.find(x => x.id === el.dataset.mid);
  $$("span.ed", app).forEach(el => {
    el.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); el.blur(); } if (e.key === "Escape") { el.textContent = el.dataset.orig ?? el.textContent; el.blur(); } });
    el.addEventListener("focus", () => { el.dataset.orig = el.textContent; });
    el.addEventListener("paste", e => { e.preventDefault(); document.execCommand("insertText", false, e.clipboardData.getData("text/plain").replace(/\s+/g, " ")); });
    el.addEventListener("blur", () => {
      const m = mapOf(el), f = el.dataset.f, raw = el.textContent.replace(/\s+/g, " ").trim();
      let v = raw;
      if (NUM_FIELDS.has(f)) { v = raw === "" ? null : Math.max(0, Math.round(+raw.replace(/[^0-9.]/g, ""))); if (Number.isNaN(v)) v = m[f]; el.textContent = v ?? ""; }
      if (f === "uvTime") { v = raw === "" ? null : parseTime(raw); if (v == null && raw !== "") v = m.uvTime; el.textContent = fmtTime(v); }
      if (f === "slot") v = raw.toUpperCase() || m.slot;
      if (m[f] === v) return;
      m[f] = v; save();
      if (f === "slot") rerender();
    });
  });
  $$("select.gsel, select.rsel", app).forEach(sel => sel.addEventListener("change", () => {
    const m = mapOf(sel), f = sel.dataset.f;
    m[f] = f === "rank" ? sel.value : sel.value === "" ? null : +sel.value;
    save(); rerender();
  }));
  $$("button[data-spawn]", app).forEach(b => b.addEventListener("click", async () => {
    const m = w.maps.find(x => x.id === b.dataset.spawn);
    const url = await pickImage(1920, 1280); if (!url) return;
    m.shots = m.shots || []; m.shots[0] = url; save(); rerender();
  }));
  $$("button.cyc", app).forEach(b => b.addEventListener("click", () => {
    const m = mapOf(b), f = b.dataset.cyc;
    m[f] = f === "casual" ? (m.casual === "Complete" ? "Incomplete" : "Complete") : MAP_DEMO[(MAP_DEMO.indexOf(m.demo) + 1) % 3];
    if (f === "demo") syncWadDemo(w);
    save(); rerender();
  }));
}

  app.querySelectorAll("[data-grade]").forEach(b => b.onclick = () => { m[b.dataset.grade] = b.dataset.v === "" ? null : +b.dataset.v; save(); rerender(); });
  app.querySelectorAll("label[data-addshot],button[data-addshot]").forEach(l => l.onclick = () => addShot(+l.dataset.addshot));
  app.querySelectorAll("[data-rmshot]").forEach(b => b.onclick = e => { e.stopPropagation(); m.shots[+b.dataset.rmshot] = null; while (m.shots.length && !m.shots[m.shots.length - 1]) m.shots.pop(); save(); rerender(); });
}

/* ---------- DEMO TRACKER ---------- */
function viewDemos(app) {
  const extra = { progress: ["Demo progress", (a, b) => demoDone(b) / (b.maps.length || 1) - demoDone(a) / (a.maps.length || 1)] };
  const { st, sorts, html } = catalogControls("demo", extra);
  st.show ||= "all";
  const totalPts = S.wads.reduce((a, w) => a + w.maps.reduce((b, m) => b + (m.demo === "Complete" ? (INDEX_PTS[m.rank] || 0) : 0), 0), 0);
  app.innerHTML = `<div class="row" style="justify-content:space-between;align-items:flex-end"><div><span class="eyebrow">DSDA-Doom UV-max</span><h1>Demo Tracker</h1></div>
    <div class="hud" style="min-width:min(100%,460px)"><div><b>${S.wads.filter(wadComplete).length}</b><span>WADs done</span></div><div><b>${S.wads.reduce((a, w) => a + demoDone(w), 0).toLocaleString()}</b><span>Maps done</span></div><div><b>${S.wads.reduce((a, w) => a + w.maps.filter(m => m.demo === "Routing & Practicing").length, 0)}</b><span>Routing</span></div><div><b>${totalPts.toLocaleString()}</b><span>Index pts</span></div></div></div>
    ${html.replace('<span class="count"', `<select id="demo-show" aria-label="Show"><option value="all">All WADs</option><option value="started" ${st.show === "started" ? "selected" : ""}>Started</option><option value="done" ${st.show === "done" ? "selected" : ""}>Fully demoed</option><option value="todo" ${st.show === "todo" ? "selected" : ""}>Not finished</option></select><span class="count"`)}
    <div class="grid" id="grid"></div>`;
  const draw = () => {
    let list = filterSort([...S.wads], st, sorts);
    if (st.show === "started") list = list.filter(w => demoDone(w) || w.maps.some(m => m.demo === "Routing & Practicing"));
    if (st.show === "done") list = list.filter(wadComplete);
    if (st.show === "todo") list = list.filter(w => !wadComplete(w));
    $("#demo-count").textContent = `${list.length} WADs`;
    $("#grid").innerHTML = list.map(w => { const n = demoDone(w), t = w.maps.length, pct = t ? n / t * 100 : 0, done = wadComplete(w);
      return `<a class="tile ${done ? "done" : ""}" href="#demo--${w.id}">${picHTML(w, done ? `<span class="badge-grade chip" style="background:var(--nukage);color:#132006;border:0">100%</span>` : "")}
      <div class="info"><span class="t">${esc(w.title)}</span><span class="a">${esc(w.authors)}</span></div>
      <div class="stack" style="gap:4px"><div class="progress ${done ? "" : "part"}" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${t}" aria-label="Demos completed"><i style="width:${pct}%"></i></div>
      <div class="prog-label"><span>${n}/${t} maps</span><span>${Math.round(pct)}%</span></div></div></a>`; }).join("") || `<p class="empty-note">No WADs match these filters.</p>`;
  };
  bindControls("demo", st, draw);
  $("#demo-show").addEventListener("change", e => { st.show = e.target.value; pref.set("demo", st); draw(); });
  draw();
}
function viewDemoWad(id, app = $("#app")) {
  const w = wadById(id); if (!w) { app.innerHTML = `<p>That WAD isn't in the catalog. <a href="#demos">Back to the tracker</a></p>`; return; }
  const maps = sortedMaps(w), n = demoDone(w), t = maps.length, done = wadComplete(w);
  const att = maps.reduce((a, m) => a + (m.attempts || 0), 0);
  const tsum = maps.filter(m => m.demo === "Complete" && m.uvTime).reduce((a, m) => a + m.uvTime, 0);
  const pts = maps.reduce((a, m) => a + (m.demo === "Complete" ? (INDEX_PTS[m.rank] || 0) : 0), 0);
  const box = s => `<span class="box ${s === "Complete" ? "b-ok" : s === "Routing & Practicing" ? "b-rt" : ""}">${s === "Complete" ? "✓" : ""}</span>`;
  app.innerHTML = `
  <div class="crumbs"><a href="#demos">Demo Tracker</a><span>/</span><span>${esc(w.title)}</span></div>
  ${wadPager(w, true)}
  <div class="hero" style="grid-template-columns:minmax(0,300px) minmax(0,1fr)">
    ${picHTML(w, "", true)}
    <div class="stack" style="gap:10px;min-width:0">
      <span class="eyebrow">${esc(w.iwad)} · ${esc(w.comp)}</span><h1 style="${done ? "color:var(--nukage)" : ""}">${esc(w.title)}</h1>
      <span class="muted">${esc(w.authors)} · <a href="#wad--${w.id}" style="color:var(--brass)">Review page</a></span>
      <div class="stack" style="gap:6px;max-width:520px"><div class="progress ${done ? "" : "part"}" style="height:12px"><i style="width:${t ? n / t * 100 : 0}%"></i></div>
        <div class="prog-label" style="font-size:14px"><span>${n} of ${t} maps demoed${done ? " · WAD complete" : ""}</span><span>${t ? Math.round(n / t * 100) : 0}%</span></div></div>
      <div class="facts"><div class="fact"><div class="k">Total attempts</div><div class="v">${att.toLocaleString()}</div></div>
        <div class="fact"><div class="k">Combined UV-max time</div><div class="v">${fmtTime(tsum) || "—"}</div></div>
        <div class="fact"><div class="k">Index points</div><div class="v">${pts.toLocaleString()}</div></div>
        <div class="fact"><div class="k">Routing now</div><div class="v">${maps.filter(m => m.demo === "Routing & Practicing").length}</div></div></div>
      ${EDIT ? `<p class="muted" style="font-size:13px;margin:0">Click a box to cycle: ${box("")} not done, ${box("Routing & Practicing")} routing &amp; practicing, ${box("Complete")} demo complete.</p>` : ""}
    </div>
  </div>
  <section class="block"><div class="tablewrap"><table class="maps"><thead><tr><th>Demo</th><th>Slot</th><th>Map</th><th class="num">Attempts</th><th>UV-max time</th><th>Doomed index rank</th><th class="num">Pts</th></tr></thead>
  <tbody>${maps.map(m => `<tr class="${m.demo === "Complete" ? "done" : ""}">
    <td>${EDIT ? `<button class="icon-btn" data-cycle="${m.id}" aria-label="${esc(m.demo || "Incomplete")}, click to change">${box(m.demo)}</button>` : box(m.demo)}</td>
    <td><span class="slot">${esc(m.slot)}</span></td><td class="wrapcell"><a class="mapname" href="#map--${w.id}--${m.id}">${esc(m.name || "Untitled")}</a></td>
    <td class="num">${EDIT ? `<input class="cell-in" type="number" min="0" data-df="attempts" data-id="${m.id}" value="${m.attempts ?? ""}" aria-label="Attempts">` : (m.attempts ?? "")}</td>
    <td>${EDIT ? `<input class="cell-in" data-df="uvTime" data-id="${m.id}" value="${fmtTime(m.uvTime)}" placeholder="m:ss" aria-label="UV-max time">` : fmtTime(m.uvTime)}</td>
    <td>${EDIT ? `<select class="cell-in" data-df="rank" data-id="${m.id}" aria-label="Index rank"><option value="">—</option>${INDEX.map(([r]) => `<option ${m.rank === r ? "selected" : ""}>${r}</option>`).join("")}</select>` : esc(m.rank)}</td>
    <td class="num">${m.rank ? `<span style="${m.demo === "Complete" ? "" : "color:var(--dim)"}">${INDEX_PTS[m.rank]}</span>` : ""}</td></tr>`).join("")}</tbody></table></div></section>`;
  if (!EDIT) return;
  app.querySelectorAll("[data-cycle]").forEach(b => b.onclick = () => { const m = w.maps.find(x => x.id === b.dataset.cycle); m.demo = MAP_DEMO[(MAP_DEMO.indexOf(m.demo) + 1) % 3]; syncWadDemo(w); save(); rerender(); });
  app.querySelectorAll("[data-df]").forEach(inp => inp.addEventListener("change", () => { const m = w.maps.find(x => x.id === inp.dataset.id), k = inp.dataset.df;
    m[k] = k === "attempts" ? (inp.value === "" ? null : +inp.value) : k === "uvTime" ? parseTime(inp.value) : inp.value;
    save(); if (k === "rank") rerender(); else if (k === "uvTime") inp.value = fmtTime(m.uvTime); }));
}
function syncWadDemo(w) {
  if (wadComplete(w)) w.demo = w.maps.length === 1 ? "Complete (SOLO WAD)" : "Complete";
  else if (/^Complete/.test(w.demo)) w.demo = "In Progress";
  else if (w.demo !== "In Progress" && w.maps.some(m => m.demo !== "Incomplete")) w.demo = "In Progress";
}

/* ---------- backup ---------- */
$("#dataBtn").addEventListener("click", () => {
  const d = $("#dlg"); d.onclose = null;
  d.innerHTML = `<form method="dialog"><div class="dhead"><h2>Backup &amp; restore</h2><button class="icon-btn" value="x" aria-label="Close">✕</button></div>
  <div class="dbody stack"><p style="margin:0">Everything you add is saved in this browser. Download a backup file now and then, especially before clearing site data, and use it to move your catalog to another device or to the live site.</p>
  <div class="row"><button type="button" class="btn primary" id="bk-dl">Download backup (.json)</button><button type="button" class="btn" id="bk-copy">Copy backup text</button>
  <label class="btn" for="bk-file">Restore from file…</label><input type="file" id="bk-file" accept="application/json,.json" hidden></div>
  <p class="muted" style="font-size:13px;margin:0" id="bk-msg">${persistOK ? "Saving in this browser is working." : "Saving in this browser is blocked here, so download a backup before closing the page."}</p>
  <hr style="border:0;border-top:1px solid var(--line);width:100%">
  <div class="row"><button type="button" class="btn danger" id="bk-reset">Reset to spreadsheet data</button><span class="muted" style="font-size:13px">Replaces everything with the original Doom_Catalog import.</span></div></div></form>`;
  d.showModal();
  const json = () => JSON.stringify(S);
  $("#bk-dl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json()], { type: "application/json" })); a.download = `wad-ranker-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); $("#bk-msg").textContent = "If no file appeared, this preview blocks downloads. Use Copy backup text instead."; };
  $("#bk-copy").onclick = () => navigator.clipboard.writeText(json()).then(() => $("#bk-msg").textContent = "Backup copied. Paste it into a .json file to keep it.", () => $("#bk-msg").textContent = "Copy was blocked here. Try Download instead.");
  $("#bk-file").onchange = e => { const f = e.target.files[0]; if (!f) return; f.text().then(async t => { let o; try { o = JSON.parse(t); if (!Array.isArray(o.wads)) throw 0; } catch { $("#bk-msg").textContent = "That file isn't a WAD Ranker backup or seed file."; return; }
    if (!o.about) o = buildFromSeed(o);
    if (SERVER) { const jobs = []; o.wads.forEach(w => { if (w.titlepic?.startsWith("data:")) jobs.push([w, "titlepic", w.id]); w.maps.forEach(m => (m.shots || []).forEach((sh, i) => { if (sh?.startsWith("data:")) jobs.push([m.shots, i, w.id + "-" + m.slot]); })); });
      for (let i = 0; i < jobs.length; i++) { $("#bk-msg").textContent = `Uploading images ${i + 1} of ${jobs.length}…`; const [obj, k, n] = jobs[i]; try { obj[k] = await storeImage(obj[k], n); } catch (e) { $("#bk-msg").textContent = "Image upload failed: " + e.message; return; } } }
    S = o; save(); d.close(); render(); toast(`Loaded ${S.wads.length} WADs`); }); };
  $("#bk-reset").onclick = () => confirmBox("Replace everything (reviews, screenshots, list edits) with the original spreadsheet import?", "Reset", async () => { try { S = buildFromSeed(await loadSeed()); } catch { toast("Use Restore and pick seed.json instead"); return; } save(); render(); toast("Reset to spreadsheet data"); });
});

async function loadSeed() { const r = await fetch("seed.json"); if (!r.ok) throw new Error("no seed"); return r.json(); }
function setupScreen(oldErr) {
  $("#app").innerHTML = ADMIN ? `<div class="notice"><h2>Load your catalog</h2>
    ${oldErr ? `<p style="margin:0">The new database is connected, but the catalog couldn't be copied over from the old storage (${esc(oldErr)}). Choose the backup file you downloaded and it will be saved to the new database.</p>`
    : `<p style="margin:0">The live site has no data yet. Choose a backup file, or <b>seed.json</b> (your spreadsheet import), and it will be saved to the site's storage.</p>`}
    <div class="row"><button class="btn primary" id="setup-seed" type="button">Load my spreadsheet data</button><label class="btn" for="setup-file">Choose file…</label><input type="file" id="setup-file" accept=".json,application/json" hidden><button class="btn" id="setup-empty" type="button">Start with an empty catalog</button></div>
    <p class="muted" id="setup-msg" style="margin:0;font-size:14px"></p></div>`
  : `<div class="notice"><h2>Coming soon</h2><p style="margin:0">The catalog is being set up. Check back shortly.</p></div>`;
  if (!ADMIN) return;
  $("#setup-seed").onclick = async () => { $("#setup-msg").textContent = "Loading…"; try { S = buildFromSeed(await loadSeed()); save(); render(); toast(`Loaded ${S.wads.length} WADs. Saving…`); } catch { $("#setup-msg").textContent = "Couldn't load seed.json. Choose the file instead."; } };
  $("#setup-empty").onclick = () => { S = buildFromSeed({ wads: [] }); save(); render(); };
  $("#setup-file").onchange = e => { const f = e.target.files[0]; if (!f) return; $("#setup-msg").textContent = "Reading…";
    f.text().then(t => { try { let o = JSON.parse(t); if (!Array.isArray(o.wads)) throw 0; if (!o.about) o = buildFromSeed(o); S = o; save(); render(); toast(`Loaded ${S.wads.length} WADs. Saving…`); } catch { $("#setup-msg").textContent = "That file isn't a WAD Ranker backup or seed file."; } }); };
}
(async () => {
  try { const r = await fetch("/api/me", { credentials: "same-origin" }); if (r.ok) { ME = await r.json(); SERVER = !!ME.server; ADMIN = !!ME.admin; } } catch {}
  applyAuthUI();
  if (SERVER) {
    try { S = await api(ADMIN ? "/api/state?fresh=" + Date.now() : "/api/state"); } catch (e) { $("#app").innerHTML = `<div class="notice"><h2>Couldn't load the catalog</h2><p style="margin:0">${esc(e.message)}</p></div>`; return; }
    if (S?.empty) { const why = S.oldStoreError; S = null; if (ADMIN) return setupScreen(why); }
    if (!S && ADMIN) return setupScreen();
    if (!S) { try { S = buildFromSeed(await loadSeed()); } catch { return setupScreen(); } }
    render(); return;
  }
  await DB.open();
  S = await DB.get("state");
  if (!S) { try { S = buildFromSeed(await loadSeed()); save(); } catch (e) { $("#app").innerHTML = `<p class="loading">Couldn't load the catalog data (seed.json).</p>`; return; } }
  render();
})();
})();
</script>
</body></html>
